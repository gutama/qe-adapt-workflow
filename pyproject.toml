[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qe-adapt-workflow"
version = "0.1.0.dev0"
description = "Reproducible Quantum ESPRESSO analysis and DFT-ADAPT-VQE workflow control"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Ginanjar Utama"}
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.scripts]
qeanalyzer = "qeanalyzer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
