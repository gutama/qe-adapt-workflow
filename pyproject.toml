[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qe-adapt-workflow"
version = "0.1.0.dev0"
description = "Reproducible Quantum ESPRESSO analysis and DFT-correlated-solver workflow control"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Ginanjar Utama"}
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
test = ["pytest>=7"]
# Real ADAPT-VQE lives in the sibling clifford_qc project; without this extra the
# ADAPT solver constructs but raises ImportError on solve().
quantum = ["clifford_qc @ git+https://github.com/gutama/clifford_qc.git"]
all = [
  "matplotlib>=3.6",
  "pytest>=7",
  "clifford_qc @ git+https://github.com/gutama/clifford_qc.git",
]

[project.urls]
Homepage = "https://github.com/gutama/qe-adapt-workflow"
QuantumBackend = "https://github.com/gutama/clifford_qc"

[project.scripts]
qeanalyzer = "qeanalyzer.cli_v2:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
