name: Apply review fixes

on:
  push:
    branches: [agent/fix-review-boundaries]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-review-boundaries
          fetch-depth: 0
      - name: Apply prepared correction set
        shell: bash
        run: |
          set -euo pipefail
          cat .review_chunk_00 .review_chunk_01 .review_chunk_02 .review_chunk_03 .review_chunk_04 .review_chunk_05 .review_chunk_06 .review_chunk_07 .review_chunk_08 .review_chunk_09 > /tmp/review-fixes.tar.gz
          tar -tzf /tmp/review-fixes.tar.gz >/dev/null
          tar -xzf /tmp/review-fixes.tar.gz -C .
          rm -f .review_chunk_* .review_fixes.tar.gz.b64 .github/workflows/apply-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix scientific boundaries and delegate ADAPT to clifford_qc'
          git push origin HEAD:agent/fix-review-boundaries
