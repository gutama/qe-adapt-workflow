name: Apply review fixes

on:
  push:
    branches: [agent/fix-review-boundaries]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-review-boundaries
          fetch-depth: 0
      - name: Apply prepared correction set
        shell: bash
        run: |
          set -euo pipefail
          test -f .review_fixes.tar.gz.b64
          tar -xzf .review_fixes.tar.gz.b64 -C .
          rm -f .review_fixes.tar.gz.b64 .github/workflows/apply-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix scientific boundaries and delegate ADAPT to clifford_qc'
          git push origin HEAD:agent/fix-review-boundaries
